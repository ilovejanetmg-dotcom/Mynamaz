<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>намаз · ультраминимализм</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #ffffff;
            font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            padding: 40px 20px 60px;
            color: #111111;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* дата */
        .date {
            font-size: 14px;
            font-weight: 400;
            color: #888888;
            margin-bottom: 24px;
            letter-spacing: -0.2px;
        }

        /* город + строка поиска */
        .city-row {
            margin-bottom: 32px;
        }
        .city-input {
            font-size: 28px;
            font-weight: 600;
            color: #111111;
            background: transparent;
            border: none;
            padding: 0;
            width: 100%;
            font-family: inherit;
            letter-spacing: -0.5px;
        }
        .city-input:focus {
            outline: none;
        }
        .city-hint {
            font-size: 11px;
            color: #bbbbbb;
            margin-top: 6px;
        }

        /* список намазов — колонка */
        .prayer-list {
            margin-bottom: 32px;
        }
        .prayer-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 0.5px solid #eeeeef;
        }
        .prayer-name {
            font-size: 17px;
            font-weight: 450;
            color: #333333;
        }
        .prayer-time {
            font-size: 17px;
            font-weight: 480;
            color: #111111;
            letter-spacing: -0.3px;
        }
        .prayer-row.current {
            border-bottom: 1px solid #000000;
        }
        .prayer-row.current .prayer-name {
            font-weight: 590;
            color: #000000;
        }
        .prayer-row.current .prayer-time {
            font-weight: 600;
        }
        .time-left-current {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
            text-align: right;
        }

        /* следующий намаз */
        .next-block {
            margin-bottom: 48px;
            padding-top: 8px;
        }
        .next-label {
            font-size: 13px;
            font-weight: 400;
            color: #888888;
            letter-spacing: 0.2px;
            margin-bottom: 6px;
        }
        .next-info {
            display: flex;
            gap: 12px;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .next-name {
            font-size: 20px;
            font-weight: 560;
            color: #111111;
        }
        .next-time {
            font-size: 20px;
            font-weight: 500;
            color: #666666;
        }
        .next-wait {
            font-size: 13px;
            color: #888888;
            margin-left: 4px;
        }

        .update-time {
            font-size: 10px;
            color: #cccccc;
            margin-top: 40px;
            text-align: center;
        }

        .loading, .error {
            padding: 40px 0;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }

        /* выпадающее меню настроек */
        .dropdown-menu {
            position: absolute;
            top: 70px;
            right: 0;
            background: #ffffff;
            border-radius: 20px;
            width: 260px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 0.5px solid #eaeaea;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: 0.12s;
        }
        .dropdown-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown-title {
            font-size: 13px;
            font-weight: 500;
            color: #888;
            text-align: center;
            margin-bottom: 16px;
        }
        .option-group {
            margin-bottom: 20px;
        }
        .group-label {
            font-size: 11px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 8px;
            display: block;
        }
        .radio-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .radio-item input {
            margin-right: 10px;
            width: 14px;
            height: 14px;
            accent-color: #111;
        }
        .radio-label {
            font-size: 13px;
            color: #333;
        }
        .apply-dropdown-btn {
            background: #f0f0ef;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 10px;
            cursor: pointer;
        }
        .apply-dropdown-btn:active {
            background: #e2e2e0;
        }

        .settings-icon {
            font-size: 20px;
            line-height: 1;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- строка с датой + кнопка настроек -->
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; position: relative;">
        <div class="date" id="dateLabel">—</div>
        <button class="settings-btn" id="settingsBtn" style="background: transparent; border: none; padding: 8px; cursor: pointer;">
            <span class="settings-icon">⋯</span>
        </button>
        <div class="dropdown-menu" id="settingsDropdown">
            <div class="dropdown-title">настройки времени</div>
            <div class="option-group">
                <span class="group-label">метод расчёта</span>
                <label class="radio-item"><input type="radio" name="methodRadio" value="13"> <span class="radio-label">ДУМ РФ</span></label>
                <label class="radio-item"><input type="radio" name="methodRadio" value="3"> <span class="radio-label">MWL</span></label>
                <label class="radio-item"><input type="radio" name="methodRadio" value="1"> <span class="radio-label">UIS</span></label>
                <label class="radio-item"><input type="radio" name="methodRadio" value="2"> <span class="radio-label">ISNA</span></label>
                <label class="radio-item"><input type="radio" name="methodRadio" value="12"> <span class="radio-label">Diyanet</span></label>
            </div>
            <div class="option-group">
                <span class="group-label">мазхаб</span>
                <label class="radio-item"><input type="radio" name="schoolRadio" value="0"> <span class="radio-label">Шафиитский</span></label>
                <label class="radio-item"><input type="radio" name="schoolRadio" value="1"> <span class="radio-label">Ханафитский</span></label>
            </div>
            <button class="apply-dropdown-btn" id="applyDropdownBtn">применить</button>
        </div>
    </div>

    <!-- город -->
    <div class="city-row">
        <input type="text" class="city-input" id="cityInput" placeholder="Москва" value="Москва">
        <div class="city-hint">нажмите ↵ для поиска</div>
    </div>

    <!-- список намазов -->
    <div id="prayerList" class="prayer-list"></div>

    <!-- следующий намаз -->
    <div id="nextBlock" class="next-block"></div>

    <div class="update-time" id="updateTime"></div>
</div>

<script>
    (function() {
        // ---------- НАМАЗ ----------
        const prayerNames = { Fajr: "Фаджр", Sunrise: "Восход", Dhuhr: "Зухр", Asr: "Аср", Maghrib: "Магриб", Isha: "Иша" };
        const prayerOrder = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];
        const monthsRu = { January: "янв", February: "фев", March: "мар", April: "апр", May: "мая", June: "июн", July: "июл", August: "авг", September: "сен", October: "окт", November: "ноя", December: "дек" };
        const weekdays = { Monday: "Пн", Tuesday: "Вт", Wednesday: "Ср", Thursday: "Чт", Friday: "Пт", Saturday: "Сб", Sunday: "Вс" };
        
        let city = "Москва", method = 13, school = 1, prayerData = null, lastLoadTime = null;
        
        function timeToMin(t) { let [h,m] = t.split(':'); return +h*60 + +m; }
        function formatTime(min) {
            if (min < 60) return `${min} мин`;
            let hours = Math.floor(min / 60);
            let mins = min % 60;
            return hours + ' ч' + (mins ? ' ' + mins + ' мин' : '');
        }
        
        function getCurrentNext(timings) {
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const prayers = prayerOrder.filter(p => timings[p]).map(p => ({
                key: p, name: prayerNames[p], time: timings[p], min: timeToMin(timings[p])
            }));
            if (!prayers.length) return { current: null, next: null };
            let nextPrayer = prayers.find(p => p.min > nowMin);
            if (nextPrayer) {
                let idx = prayers.indexOf(nextPrayer);
                return { current: idx > 0 ? prayers[idx-1] : null, next: nextPrayer };
            }
            return { current: prayers[prayers.length-1], next: { ...prayers[0], min: prayers[0].min + 1440 } };
        }
        
        // Время до окончания текущего намаза (следующий намаз - сейчас)
        function getTimeLeftForCurrent(current, next, nowMin) {
            if (!current || !next) return null;
            const currentEndMin = next.min;
            const left = currentEndMin - nowMin;
            if (left <= 0) return null;
            return formatTime(left);
        }
        
        function renderPrayers() {
            if (!prayerData) return;
            const timings = prayerData.timings;
            const dateData = prayerData.date.gregorian;
            const dateStr = `${weekdays[dateData.weekday.en]}, ${dateData.day} ${monthsRu[dateData.month.en]}`;
            document.getElementById('dateLabel').innerText = dateStr;
            
            const { current, next } = getCurrentNext(timings);
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const leftMinForCurrent = getTimeLeftForCurrent(current, next, nowMin);
            const leftMinForNext = next ? next.min - nowMin : 0;
            
            // список намазов
            let listHtml = '';
            for (let key of prayerOrder) {
                if (timings[key]) {
                    const isCurrent = current?.key === key;
                    listHtml += `<div class="prayer-row ${isCurrent ? 'current' : ''}">
                        <span class="prayer-name">${prayerNames[key]}</span>
                        <span class="prayer-time">${timings[key]}</span>
                    </div>`;
                    // Если это текущий намаз и есть время до окончания — добавляем строку с таймером
                    if (isCurrent && leftMinForCurrent) {
                        listHtml += `<div class="time-left-current">ещё ${leftMinForCurrent}</div>`;
                    }
                }
            }
            document.getElementById('prayerList').innerHTML = listHtml;
            
            // следующий намаз
            let nextHtml = '';
            if (next) {
                const waitFormatted = leftMinForNext > 0 ? `через ${formatTime(leftMinForNext)}` : '';
                nextHtml = `<div class="next-label">следующий намаз</div>
                    <div class="next-info">
                        <span class="next-name">${prayerNames[next.key]}</span>
                        <span class="next-time">${next.time}</span>
                        ${waitFormatted ? `<span class="next-wait">${waitFormatted}</span>` : ''}
                    </div>`;
            }
            document.getElementById('nextBlock').innerHTML = nextHtml;
            
            if (lastLoadTime) {
                document.getElementById('updateTime').innerHTML = `обновлено: ${lastLoadTime.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'})}`;
            }
        }
        
        async function loadPrayerData(force = false) {
            if (!force && prayerData && lastLoadTime && new Date().toDateString() === new Date(lastLoadTime).toDateString()) { renderPrayers(); return; }
            document.getElementById('prayerList').innerHTML = '<div class="loading">загрузка...</div>';
            try {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 8000);
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=Россия&method=${method}&school=${school}`, { signal: controller.signal });
                const data = await response.json();
                if (data.code === 200) {
                    prayerData = { timings: data.data.timings, date: data.data.date };
                    lastLoadTime = new Date();
                    localStorage.setItem('azan_cache_ultra', JSON.stringify({ city, method, school, prayerData, time: lastLoadTime.toISOString() }));
                    renderPrayers();
                } else throw new Error();
            } catch(e) {
                if (prayerData) { renderPrayers(); document.getElementById('updateTime').innerHTML = '⚠️ офлайн (кэш)'; }
                else document.getElementById('prayerList').innerHTML = '<div class="error">ошибка загрузки</div>';
            }
        }
        
        function saveSettings() { 
            localStorage.setItem('azan_city_ultra', city); 
            localStorage.setItem('azan_method_ultra', method); 
            localStorage.setItem('azan_school_ultra', school);
        }
        
        // ---------- ВЫПАДАЮЩЕЕ МЕНЮ ----------
        const dropdown = document.getElementById('settingsDropdown');
        const settingsBtn = document.getElementById('settingsBtn');
        const applyBtn = document.getElementById('applyDropdownBtn');
        const methodRadios = document.querySelectorAll('input[name="methodRadio"]');
        const schoolRadios = document.querySelectorAll('input[name="schoolRadio"]');
        
        function syncDropdown() {
            methodRadios.forEach(r => { if (parseInt(r.value) === method) r.checked = true; });
            schoolRadios.forEach(r => { if (parseInt(r.value) === school) r.checked = true; });
        }
        function closeDropdown() { dropdown.classList.remove('open'); }
        function openDropdown() { syncDropdown(); dropdown.classList.add('open'); }
        function applySettings() {
            let newMethod = method, newSchool = school;
            for (let r of methodRadios) if (r.checked) { newMethod = parseInt(r.value); break; }
            for (let r of schoolRadios) if (r.checked) { newSchool = parseInt(r.value); break; }
            let needReload = false;
            if (newMethod !== method) { method = newMethod; needReload = true; }
            if (newSchool !== school) { school = newSchool; needReload = true; }
            saveSettings();
            closeDropdown();
            if (needReload) loadPrayerData(true);
        }
        settingsBtn.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.contains('open') ? closeDropdown() : openDropdown(); });
        applyBtn.addEventListener('click', applySettings);
        document.addEventListener('click', (e) => { if (!dropdown.contains(e.target) && e.target !== settingsBtn) closeDropdown(); });
        
        // ---------- ГОРОД ----------
        const cityInput = document.getElementById('cityInput');
        function searchCity() {
            const newCity = cityInput.value.trim();
            if (newCity && newCity !== city) { city = newCity; saveSettings(); loadPrayerData(true); }
        }
        cityInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchCity(); });
        cityInput.addEventListener('blur', searchCity);
        
        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        const cached = localStorage.getItem('azan_cache_ultra');
        if (cached) {
            try {
                let c = JSON.parse(cached);
                let savedCity = localStorage.getItem('azan_city_ultra') || 'Москва';
                if (c.city === savedCity) { prayerData = c.prayerData; lastLoadTime = new Date(c.time); }
            } catch(e) {}
        }
        city = localStorage.getItem('azan_city_ultra') || 'Москва';
        method = parseInt(localStorage.getItem('azan_method_ultra') || '13');
        school = parseInt(localStorage.getItem('azan_school_ultra') || '1');
        cityInput.value = city;
        
        loadPrayerData();
        setInterval(() => { if (prayerData) renderPrayers(); }, 60000);
    })();
</script>
</body>
</html>
